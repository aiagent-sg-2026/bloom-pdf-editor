name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - run: npm run verify:pdf-worker
      - run: npm run verify:browser-only
      - run: npm run verify:browser-core
      - name: Remove root export
        run: rm -rf out
      - name: Build sub-path export
        env:
          NEXT_PUBLIC_BASE_PATH: /bloom-pdf-editor
        run: npm run build
      - name: Verify sub-path export
        env:
          NEXT_PUBLIC_BASE_PATH: /bloom-pdf-editor
        run: |
          npm run verify:pdf-worker
          npm run verify:browser-only
          npm run verify:browser-core
          npm run verify:base-path
