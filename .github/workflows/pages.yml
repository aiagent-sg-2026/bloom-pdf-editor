name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set Pages base path
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          OWNER_NAME: ${{ github.repository_owner }}
        run: |
          base_path="/$REPOSITORY_NAME"
          if [[ "${REPOSITORY_NAME,,}" == "${OWNER_NAME,,}.github.io" ]]; then
            base_path=""
          fi
          printf 'NEXT_PUBLIC_BASE_PATH=%s\n' "$base_path" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run verify:pdf-worker
      - run: npm run verify:browser-only
      - run: npm run verify:browser-core
      - run: npm run verify:base-path
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
